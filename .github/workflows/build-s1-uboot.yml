name: Build Aqara S1 Plus U-Boot

on:
  pull_request:
    paths:
      - 'frames/aqara-s1-plus/uboot/**'
      - '.github/workflows/build-s1-uboot.yml'
  push:
    branches: [main]
    paths:
      - 'frames/aqara-s1-plus/uboot/**'
      - '.github/workflows/build-s1-uboot.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to publish (e.g. aqara-s1-plus-uboot-v2). Leave empty to only build and upload workflow artifacts.'
        required: false
        default: ''
      draft:
        description: 'Publish as a draft release until verified on real S1 hardware'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install native arm64 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev python3 python3-dev \
            python3-setuptools python3-pyelftools swig device-tree-compiler libgnutls28-dev uuid-dev xz-utils

      - name: Build U-Boot and package Corresponding Source
        run: |
          chmod +x frames/aqara-s1-plus/uboot/build.sh
          frames/aqara-s1-plus/uboot/build.sh --native --out dist --work "$RUNNER_TEMP/uboot-work"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aqara-s1-plus-uboot
          path: dist/
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          if ! [[ "$TAG" =~ ^aqara-s1-plus-uboot-v[0-9]+$ ]]; then
            echo "::error::release_tag must match aqara-s1-plus-uboot-v<N> (got: $TAG)"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; releases are immutable."
            exit 1
          fi
          FLAGS=()
          if [ "$DRAFT" = "true" ]; then
            FLAGS+=(--draft)
          fi
          gh release create "$TAG" "${FLAGS[@]}" \
            --title "Aqara S1 Plus U-Boot ($TAG)" \
            --notes "Standalone RAM-only U-Boot SPL and U-Boot for the Aqara Panel Hub S1 Plus, built from commit \`${GITHUB_SHA}\`. Includes full Corresponding Source (\`aqara-s1-plus-uboot-source.tar.xz\`), \`SHA256SUMS\`, and \`release-meta.json\`." \
            dist/u-boot-sunxi-with-spl.bin \
            dist/u-boot.bin \
            dist/aqara-s1-plus-uboot-source.tar.xz \
            dist/SHA256SUMS \
            dist/release-meta.json
