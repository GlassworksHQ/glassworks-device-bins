name: Build lululemon Mirror selinux_permissive

on:
  pull_request:
    paths:
      - 'frames/lululemon-mirror/selinux-permissive/**'
      - '.github/workflows/build-mirror-selinux-permissive.yml'
  push:
    branches: [main]
    paths:
      - 'frames/lululemon-mirror/selinux-permissive/**'
      - '.github/workflows/build-mirror-selinux-permissive.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to publish (e.g. lululemon-mirror-selinux-permissive-v1). Leave empty to only build and upload workflow artifacts.'
        required: false
        default: ''
      draft:
        description: 'Publish as a draft release until the built .ko is verified on a real Mirror'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install the pinned clang and xz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 xz-utils python3

      - name: Build selinux_permissive and package Corresponding Source
        env:
          CC: clang-18
        run: |
          chmod +x frames/lululemon-mirror/selinux-permissive/build.sh
          frames/lululemon-mirror/selinux-permissive/build.sh --native --out dist --work "$RUNNER_TEMP/sp-work"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lululemon-mirror-selinux-permissive
          path: dist/
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          if ! [[ "$TAG" =~ ^lululemon-mirror-selinux-permissive-v[0-9]+$ ]]; then
            echo "::error::release_tag must match lululemon-mirror-selinux-permissive-v<N> (got: $TAG)"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; releases are immutable."
            exit 1
          fi
          # A pre-existing tag (without a release) must point at the exact commit we built,
          # or the tag would identify different source than the uploaded module. The checkout is
          # shallow and fetches no tags, and deleting a release leaves its tag behind, so query the
          # remote and peel annotated tags to their commit rather than trusting the local refs.
          REMOTE_REFS=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          EXISTING_SHA=$(awk -v r="refs/tags/$TAG" '$2==(r"^{}"){p=$1} $2==r{d=$1} END{print (p ? p : d)}' <<< "$REMOTE_REFS")
          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already exists at $EXISTING_SHA but this build is $GITHUB_SHA; refusing to mismatch tag and binaries."
            exit 1
          fi
          FLAGS=()
          if [ "$DRAFT" = "true" ]; then
            FLAGS+=(--draft)
          fi
          gh release create "$TAG" "${FLAGS[@]}" \
            --target "$GITHUB_SHA" \
            --title "lululemon Mirror selinux_permissive ($TAG)" \
            --notes "Standalone single-boot read-only backup helper module for the lululemon Studio Mirror (stock 1.24.0, module_layout 0xa5b7f7dd), built from commit \`${GITHUB_SHA}\` with clang-18. Includes full Corresponding Source (\`lululemon-mirror-selinux-permissive-source.tar.xz\`), \`SHA256SUMS\`, and \`release-meta.json\`. Verify on a real Mirror before GlassworksHQ/glassworks pins this build's SHA-256." \
            dist/selinux_permissive.ko \
            dist/lululemon-mirror-selinux-permissive-source.tar.xz \
            dist/SHA256SUMS \
            dist/release-meta.json
